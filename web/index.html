<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gbcEmuIAtor</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="app">
    <section id="ide" aria-label="IDE">
      <div class="placeholder">
        <h2>IDE SM83</h2>
        <p>Ensamblador, compilador C y depurador: fase 2.</p>
      </div>
    </section>
    <div id="splitter" role="separator" aria-orientation="vertical" title="Arrastra para redimensionar (doble clic: restablecer)"></div>

    <section id="emu" aria-label="Emulador">
      <div id="toolbar">
        <button id="btn-open" title="Abrir ROM (.gb, .gbc)">Abrir ROM</button>
        <button id="btn-reset" title="Reiniciar" disabled>Reset</button>
        <button id="btn-pause" title="Pausa (P)" disabled>Pausa</button>
        <span class="sep"></span>
        <button id="btn-save-state" title="Guardar estado (F2)" disabled>Guardar estado</button>
        <button id="btn-load-state" title="Cargar estado (F4)" disabled>Cargar estado</button>
        <span class="sep"></span>
        <button id="btn-sav-export" title="Descargar la partida (.sav)" disabled>.sav ↓</button>
        <button id="btn-sav-import" title="Importar una partida (.sav)" disabled>.sav ↑</button>
        <span class="sep"></span>
        <button id="btn-sound" title="Sonido">🔇 Sonido</button>
        <label title="Corrección de color del LCD del CGB"><input type="checkbox" id="chk-cc" checked /> Color LCD</label>
        <label>Escala
          <select id="sel-scale">
            <option value="2">2×</option><option value="3">3×</option>
            <option value="4" selected>4×</option><option value="5">5×</option>
          </select>
        </label>
        <button id="btn-boot" title="Cargar tu propia boot ROM de CGB (se guarda sólo en este navegador)">Boot ROM…</button>
      </div>

      <div id="screen-wrap">
        <canvas id="screen" width="160" height="144"></canvas>
        <div id="drop-hint">Arrastra aquí una ROM .gb / .gbc<br />o pulsa «Abrir ROM»</div>
      </div>

      <div id="status"><span id="st-cart">Sin cartucho</span><span id="st-fps"></span></div>
      <div id="help">
        Cruceta: flechas / WASD · A: X / K · B: Z / J · Start: Enter · Select: Retroceso / Mayús dcha.
        · Avance rápido: mantener Tab · Pausa: P · Mando compatible
      </div>
      <div id="msg" role="status"></div>
    </section>
  </main>

  <input type="file" id="file-rom" accept=".gb,.gbc,.cgb" hidden />
  <input type="file" id="file-sav" accept=".sav" hidden />
  <input type="file" id="file-boot" accept=".bin,.gbc,.rom" hidden />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
